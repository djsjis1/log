name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # 三个编译器的库与测试均已零告警（各作业日志核验过），全部 -Werror 守住不倒退。
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DMYLOG_WERROR=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # 并发用例有调度不确定性：重复跑才能证明“偶尔失败”不是回归。
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --repeat until-fail:3

  clang:
    # clang 常暴露与 gcc/MSVC 不同的告警和模板实例化问题，单独覆盖一档。
    name: ubuntu / clang
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMYLOG_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --repeat until-fail:3

  sanitizers:
    name: ubuntu / asan+ubsan
    runs-on: ubuntu-latest
    env:
      # 回收线程对象是有意不析构的（避免与静态析构顺序纠缠），
      # LeakSanitizer 会把它当成泄漏报错，因此只开内存错误检查。
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build/asan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DMYLOG_WERROR=ON

      - name: Build
        run: cmake --build build/asan --parallel

      - name: Test
        run: ctest --test-dir build/asan --output-on-failure

      - name: Publish failure details
        if: failure()
        run: |
          {
            echo '### ctest 失败详情'
            echo '```'
            sed -n '/The following tests FAILED/,$p' build/asan/Testing/Temporary/LastTest.log | head -n 40 || true
            echo '--- tail of LastTest.log ---'
            tail -n 300 build/asan/Testing/Temporary/LastTest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tsan:
    # ASan 只抓越界/释放后使用，抓不到数据竞争；而本库的重点（单例快照、文件占用、
    # 共享刷新调度器）全在并发路径上，只有 TSan 能给出“真的没问题”的证据。
    name: ubuntu / tsan
    runs-on: ubuntu-latest
    env:
      # halt_on_error=0：一次跑完，把所有竞争都报出来，而不是只报第一个。
      # suppressions 里记录了已知的 spdlog 回溯锁序假阳性（见 .github/tsan.supp）。
      TSAN_OPTIONS: halt_on_error=0 history_size=7 second_deadlock_stack=1 suppressions=${{ github.workspace }}/.github/tsan.supp
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 22.04+ 的内核把 mmap_rnd_bits 调大后，sanitizer 在启动阶段偶发
      # "unexpected memory mapping"；放宽到 28 位，失败也不影响后续步骤。
      - name: Relax ASLR entropy for sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: Configure
        run: >
          cmake -S . -B build/tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          -DMYLOG_TEST_TIMEOUT=1500
          -DMYLOG_PROBE_TIMEOUT=300
          -DMYLOG_WERROR=ON

      - name: Build
        run: cmake --build build/tsan --parallel

      # 先确认 TSan 本身能跑：Ubuntu 新内核启用了更大的 mmap 随机化时，
      # TSan 会在启动阶段直接 abort（unexpected memory mapping），
      # 这类环境问题和真实的 data race 在 ctest 输出里很像，必须先区分开。
      - name: TSan smoke check
        run: |
          cat > /tmp/tsan_smoke.cpp <<'EOF'
          #include <thread>
          #include <cstdio>
          int main() {
              int x = 0;
              std::thread t([&] { x = 1; });
              t.join();
              std::printf("tsan-smoke-ok %d\n", x);
              return 0;
          }
          EOF
          g++ -std=c++17 -g -O1 -fsanitize=thread -pthread /tmp/tsan_smoke.cpp -o /tmp/tsan_smoke
          if setarch "$(uname -m)" -R true 2>/dev/null; then
            setarch "$(uname -m)" -R /tmp/tsan_smoke
          else
            /tmp/tsan_smoke
          fi

      # TSan 下整体慢一个数量级，这里不做 --repeat：
      # “偶发失败”的重复验证仍由上面的 build-and-test 作业负责。
      # setarch -R 关闭 ASLR：与上面的 sysctl 一起解决 TSan 启动崩溃。
      - name: Test
        run: |
          if setarch "$(uname -m)" -R true 2>/dev/null; then
            setarch "$(uname -m)" -R ctest --test-dir build/tsan --output-on-failure
          else
            ctest --test-dir build/tsan --output-on-failure
          fi

      - name: Publish failure details
        if: failure()
        run: |
          log=build/tsan/Testing/Temporary/LastTest.log
          {
            echo '### ctest 失败详情'
            echo '```'
            sed -n '/The following tests FAILED/,$p' "$log" | head -n 20 || true
            echo '--- TSan 报告 ---'
            grep -n -m3 -A12 'WARNING: ThreadSanitizer' "$log" || echo 'no TSan report found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 同时用 annotation 发一份：annotation 无需登录即可通过 API 读取。
          if [ -f "$log" ]; then
            msg=$(grep -m1 -A45 'WARNING: ThreadSanitizer' "$log" | tr -d '\r' | tr '\n' '~' | sed 's/~/ | /g' | cut -c1-5000)
            echo "::error title=TSan race::${msg:-no report}"
          fi
